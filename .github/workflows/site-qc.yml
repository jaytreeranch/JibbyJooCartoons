name: site-qc
on:
  push:
    paths:
      - '.github/workflows/site-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: DNS and TLS checks
        shell: bash
        run: |
          mkdir -p qc-output
          : > qc-output/network.txt
          echo "===== ROOT DOMAIN DNS =====" >> qc-output/network.txt
          dig +noall +answer jaytreebooks.com CAA >> qc-output/network.txt
          dig +noall +answer _github-pages-challenge-jaytreeranch.jaytreebooks.com TXT >> qc-output/network.txt
          echo >> qc-output/network.txt
          echo "===== GITHUB PAGES API =====" >> qc-output/network.txt
          for repo in JibbyJooCartoons Daily365Motivation IfItStoppedTV; do
            echo "-- $repo --" >> qc-output/network.txt
            curl -sS -H "Accept: application/vnd.github+json" "https://api.github.com/repos/jaytreeranch/$repo/pages" >> qc-output/network.txt || true
            echo >> qc-output/network.txt
          done
          echo >> qc-output/network.txt
          for host in jibbyjoo.jaytreebooks.com daily365.jaytreebooks.com ifitstopped.jaytreebooks.com; do
            {
              echo "===== $host ====="
              echo "-- DNS --"
              dig +noall +answer "$host" CNAME
              dig +noall +answer "$host" A
              echo "-- HTTPS HEAD --"
              curl -I --max-time 20 -sS "https://$host/" || true
              echo "-- HTTP HEAD --"
              curl -I --max-time 20 -sS "http://$host/" || true
              echo "-- CERT --"
              echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true
              echo
            } >> qc-output/network.txt
          done

      - name: Browser screenshots and layout checks
        shell: bash
        run: |
          cat > qc.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const sites = [
            ['jibbyjoo','jibbyjoo.jaytreebooks.com'],
            ['daily365','daily365.jaytreebooks.com'],
            ['ifitstopped','ifitstopped.jaytreebooks.com']
          ];
          const viewports = [
            ['desktop',{width:1600,height:1000}],
            ['mobile',{width:390,height:844}]
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            for(const [slug,host] of sites){
              for(const [mode,viewport] of viewports){
                const context=await browser.newContext({viewport,ignoreHTTPSErrors:true});
                const page=await context.newPage();
                let response=null, error=null, tried='https';
                try {
                  response=await page.goto('https://'+host+'/?qc='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                } catch(e) {
                  error=String(e);
                  tried='http';
                  try { response=await page.goto('http://'+host+'/?qc='+Date.now(),{waitUntil:'networkidle',timeout:30000}); }
                  catch(e2){ error += ' | HTTP fallback: '+String(e2); }
                }
                await page.waitForTimeout(1200).catch(()=>{});
                await page.screenshot({path:`qc-output/${slug}-${mode}-top.png`,fullPage:false});
                await page.evaluate(async()=>{
                  const step=Math.max(300, Math.floor(innerHeight*0.7));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=step){
                    scrollTo(0,y);
                    await new Promise(r=>setTimeout(r,120));
                  }
                  scrollTo(0,0);
                  await new Promise(r=>setTimeout(r,300));
                }).catch(()=>{});
                const metrics=await page.evaluate(()=>({
                  title:document.title,
                  href:location.href,
                  width:innerWidth,
                  height:innerHeight,
                  scrollWidth:document.documentElement.scrollWidth,
                  scrollHeight:document.documentElement.scrollHeight,
                  bodyOverflowX:getComputedStyle(document.body).overflowX,
                  h1:(document.querySelector('h1')?.innerText||'').replace(/\s+/g,' ').trim(),
                  navHeight:Math.round(document.querySelector('header')?.getBoundingClientRect().height||0),
                  heroHeight:Math.round(document.querySelector('.hero')?.getBoundingClientRect().height||0),
                  images:[...document.images].map(i=>({src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight],box:[Math.round(i.getBoundingClientRect().width),Math.round(i.getBoundingClientRect().height)]}))
                })).catch(()=>({}));
                let sec=null;
                try { if(response && response.securityDetails) sec=await response.securityDetails(); } catch(e){}
                report.push({slug,host,mode,tried,status:response?.status()||null,error,security:sec,metrics});
                await page.screenshot({path:`qc-output/${slug}-${mode}-full.png`,fullPage:true});
                await context.close();
              }
            }
            fs.writeFileSync('qc-output/browser.json',JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qc.js

      - name: Bundle QC evidence
        if: always()
        run: |
          tar -czf site-qc-evidence.tar.gz qc-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-qc-evidence
          path: |
            qc-output
            site-qc-evidence.tar.gz
          retention-days: 2
