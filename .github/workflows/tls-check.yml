name: tls-check
on:
  push:
    paths:
      - '.github/workflows/tls-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all custom-domain certificates
        shell: bash
        run: |
          set +e
          for host in jibbyjoo.jaytreebooks.com daily365.jaytreebooks.com ifitstopped.jaytreebooks.com; do
            echo "===== $host ====="
            echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
            echo "-- VERIFIED HTTPS --"
            curl -I --max-time 20 -sS "https://$host/" | head -20
            echo
          done
