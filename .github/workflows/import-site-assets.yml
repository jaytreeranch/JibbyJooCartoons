name: import-site-assets
on:
  push:
    paths:
      - '.github/workflows/import-site-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import approved production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --silent --show-error 'https://uc845a1346f0898358cd428bb3d2.dl.dropboxusercontent.com/cd/0/get/DI4IQY4iYwqSnPjRB8aSCXrreLc7Vfa1m2idrD5rCyskw-UbwRUuxVu0WAeeJICimy3sROlp3WAZ0SDiH5YT5kaLWY1QQmn5JJqCSlxDmnjox8UrbolTGMwBjsDKE8bz73zU-0astqFQzJQUvQARoIDbj13yzxhu1va-37H42-zSYA/file?c_luid=b7c2f533' -o 'assets/world-treehouse.png'
          curl -L --fail --silent --show-error 'https://uce814893eaa6312323d19e64dd3.dl.dropboxusercontent.com/cd/0/get/DI5gnvivFuoAkr1eXS8dMaf19v-oOAwbdA-ZdPDZJJWUg3LxOKZjxrO13qhZhXOhA870tNeESRrZVkm1Nm7oj3PSXyvh-q4CxXUUjCOgvTimA0Va0km9mYH34geSAENgxHzDWs_pZIlNv4Mc2EP5JA7zdoRumJ56jW3pPCqIqllxDw/file?c_luid=b7c2f533' -o 'assets/world-river.png'
          curl -L --fail --silent --show-error 'https://uc24b3f502910cfd2c2108f7c5a3.dl.dropboxusercontent.com/cd/0/get/DI7qreQ-JpmTxP6-jkeUr5p2Fx-7Bogsw0RtKp8CGesR2ySddSOlg625bvhPGoMRrtZp-sOzTPWn9xELSAwYuCFKGaViFpdKYu33IimpzRtEC6QbnfHt-ILjyBZbcwciEd6CnE1JCAEGaTtFxZvvixLjHpqKGJS4cR_egDHc9gFCIQ/file?c_luid=b7c2f533' -o 'assets/world-meadow.png'
          curl -L --fail --silent --show-error 'https://ucbcb80361045e5d8a23248141ac.dl.dropboxusercontent.com/cd/0/get/DI6d2l5dIjO1qcWQyEV0E-5D5-hehI3bVkamdA4tYGI3FN2fMw4S1DEsEGI14sqeP5Gem_YtATzfLMEnCzdN3vk9kJIB0WSiWMvIGp9C5tuVgaN6lWr8NnioNEmbHqAR4q8Ng92aOp2szNgLzV0Ww9rYWz2rKbeeOWPob-FSgJaF6Q/file?c_luid=b7c2f533' -o 'assets/world-lookout.png'
          file assets/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Mirror approved production art for website" || exit 0
          git push origin main
