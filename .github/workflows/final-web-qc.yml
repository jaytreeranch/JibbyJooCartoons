name: final-web-qc
on:
  push:
    paths:
      - '.github/workflows/final-web-qc.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and accessibility tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run final visual and accessibility QC
        shell: bash
        run: |
          mkdir -p final-qc
          cat > final-qc.js <<'JS'
          const { chromium } = require('playwright');
          const AxeBuilder = require('@axe-core/playwright').default;
          const fs=require('fs');

          const sites=[
            ['jibbyjoo','https://jibbyjoo.jaytreebooks.com/'],
            ['daily365','https://daily365.jaytreebooks.com/'],
            ['ifitstopped','https://ifitstopped.jaytreebooks.com/']
          ];
          const viewports=[
            ['laptop',{width:1366,height:768}],
            ['tablet',{width:820,height:1180}],
            ['mobile',{width:390,height:844}]
          ];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const [slug,url] of sites){
              for(const [mode,viewport] of viewports){
                const context=await browser.newContext({viewport});
                const page=await context.newPage();
                const consoleErrors=[];
                page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                const response=await page.goto(url+'?finalqc='+Date.now(),{waitUntil:'networkidle',timeout:30000});
                await page.waitForTimeout(900);
                await page.evaluate(async()=>{
                  const step=Math.max(300,Math.floor(innerHeight*0.7));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=step){
                    scrollTo(0,y);
                    await new Promise(r=>setTimeout(r,120));
                  }
                  scrollTo(0,0);
                  await new Promise(r=>setTimeout(r,350));
                });

                const metrics=await page.evaluate(()=>{
                  const box=sel=>{
                    const e=document.querySelector(sel);if(!e)return null;
                    const r=e.getBoundingClientRect();
                    return {top:Math.round(r.top),bottom:Math.round(r.bottom),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),height:Math.round(r.height)};
                  };
                  const primary=document.querySelector('.hero-actions .button.primary');
                  const featured=document.querySelector('.featured');
                  const featuredTitle=featured?.querySelector('h2')?.textContent?.trim()||'';
                  return {
                    viewport:[innerWidth,innerHeight],
                    scrollWidth:document.documentElement.scrollWidth,
                    scrollHeight:document.documentElement.scrollHeight,
                    overflowX:document.documentElement.scrollWidth>innerWidth+2,
                    h1:box('h1'),
                    hero:box('.hero'),
                    primaryCTA:primary?box('.hero-actions .button.primary'):null,
                    primaryCTAVisible:primary?primary.getBoundingClientRect().bottom<=innerHeight:false,
                    featuredTitle,
                    featuredImage:featured?.querySelector('img')?.getAttribute('src')||'',
                    featuredLink:featured?.querySelector('a')?.getAttribute('href')||'',
                    brokenImages:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src),
                    missingAlts:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.src),
                    focusables:[...document.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].length
                  };
                });

                const axe=await new AxeBuilder({page})
                  .withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa'])
                  .analyze();

                await page.screenshot({path:`final-qc/${slug}-${mode}.png`,fullPage:true});
                results.push({
                  slug,mode,status:response?.status()||null,
                  consoleErrors,metrics,
                  axe:{
                    violations:axe.violations.map(v=>({
                      id:v.id,impact:v.impact,help:v.help,
                      nodes:v.nodes.map(n=>({html:n.html,target:n.target,failureSummary:n.failureSummary}))
                    })),
                    passes:axe.passes.length,
                    incomplete:axe.incomplete.map(v=>({id:v.id,impact:v.impact,help:v.help,nodes:v.nodes.length}))
                  }
                });
                await context.close();
              }
            }
            fs.writeFileSync('final-qc/report.json',JSON.stringify(results,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node final-qc.js

      - name: Check redirects, TLS, and featured feeds
        shell: bash
        run: |
          {
            for host in jibbyjoo.jaytreebooks.com daily365.jaytreebooks.com ifitstopped.jaytreebooks.com; do
              echo "===== $host ====="
              echo "-- HTTP --"
              curl -I -sS --max-time 20 "http://$host/" | head -12
              echo "-- HTTPS --"
              curl -I -sS --max-time 20 "https://$host/" | head -12
              echo "-- FEATURED --"
              curl -sS --max-time 20 "https://$host/featured.json"
              echo
              echo "-- CERT --"
              echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
              echo
            done
          } > final-qc/network.txt

      - uses: actions/upload-artifact@v4
        with:
          name: final-web-qc
          path: final-qc
          retention-days: 2
