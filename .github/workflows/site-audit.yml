name: site-audit
on:
  push:
    paths:
      - '.github/workflows/site-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and accessibility tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit deployed sites
        shell: bash
        run: |
          mkdir -p site-audit
          cat > audit.js <<'JS'
          const { chromium } = require('playwright');
          const AxeBuilder = require('@axe-core/playwright').default;
          const fs = require('fs');
          const sites = [
            ['jibbyjoo','https://jibbyjoo.jaytreebooks.com/'],
            ['daily365','https://daily365.jaytreebooks.com/'],
            ['ifitstopped','https://ifitstopped.jaytreebooks.com/']
          ];
          const viewports = [
            ['desktop',{width:1600,height:1000}],
            ['laptop',{width:1366,height:768}],
            ['tablet',{width:820,height:1180}],
            ['mobile',{width:390,height:844}]
          ];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            for(const [slug,url] of sites){
              for(const [mode,viewport] of viewports){
                const context=await browser.newContext({viewport});
                const page=await context.newPage();
                const consoleErrors=[];
                page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                const response=await page.goto(url+'?audit='+Date.now(),{waitUntil:'networkidle',timeout:35000});
                await page.waitForTimeout(800);

                const layout=await page.evaluate(()=>{
                  const hero=document.querySelector('.hero');
                  const cta=document.querySelector('.hero-actions a, .hero-actions button');
                  const hr=hero?.getBoundingClientRect();
                  const cr=cta?.getBoundingClientRect();
                  const imgs=[...document.images];
                  return {
                    viewport:[innerWidth,innerHeight],
                    document:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],
                    overflowX:document.documentElement.scrollWidth>innerWidth+2,
                    hero:hr ? {top:Math.round(hr.top),bottom:Math.round(hr.bottom),height:Math.round(hr.height)} : null,
                    primaryCTA:cr ? {top:Math.round(cr.top),bottom:Math.round(cr.bottom),left:Math.round(cr.left),right:Math.round(cr.right),visible:cr.top>=0 && cr.bottom<=innerHeight} : null,
                    brokenImages:imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src),
                    images:imgs.map(i=>({src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight]})),
                    headings:[...document.querySelectorAll('h1,h2,h3')].map(h=>({tag:h.tagName,text:h.innerText.replace(/\s+/g,' ').trim()})),
                    landmarks:{
                      main:document.querySelectorAll('main').length,
                      nav:document.querySelectorAll('nav').length,
                      footer:document.querySelectorAll('footer').length
                    }
                  };
                });

                await page.screenshot({path:`site-audit/${slug}-${mode}-top.png`,fullPage:false});
                const a11y=await new AxeBuilder({page})
                  .withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa'])
                  .analyze();

                const focus=[];
                await page.evaluate(()=>window.scrollTo(0,0));
                for(let i=0;i<14;i++){
                  await page.keyboard.press('Tab');
                  const f=await page.evaluate(()=>{
                    const e=document.activeElement;
                    if(!e || e===document.body) return null;
                    const r=e.getBoundingClientRect(), s=getComputedStyle(e);
                    return {
                      tag:e.tagName,
                      text:(e.innerText||e.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().slice(0,120),
                      href:e.getAttribute('href'),
                      rect:[Math.round(r.left),Math.round(r.top),Math.round(r.width),Math.round(r.height)],
                      outline:[s.outlineStyle,s.outlineWidth,s.outlineColor],
                      boxShadow:s.boxShadow,
                      inViewport:r.bottom>0 && r.top<innerHeight && r.right>0 && r.left<innerWidth
                    };
                  });
                  if(f) focus.push(f);
                }

                await page.evaluate(async()=>{
                  const step=Math.max(300,Math.floor(innerHeight*.7));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=step){
                    scrollTo(0,y); await new Promise(r=>setTimeout(r,70));
                  }
                  scrollTo(0,0); await new Promise(r=>setTimeout(r,250));
                });
                const afterScrollBrokenImages=await page.evaluate(()=>[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.src));
                await page.screenshot({path:`site-audit/${slug}-${mode}-full.png`,fullPage:true});

                results.push({
                  slug,url,mode,status:response?.status()||null,
                  consoleErrors,layout,afterScrollBrokenImages,focus,
                  axe:{
                    passes:a11y.passes.length,
                    violations:a11y.violations.map(v=>({
                      id:v.id,impact:v.impact,description:v.description,help:v.help,helpUrl:v.helpUrl,
                      nodes:v.nodes.map(n=>({target:n.target,html:n.html,failureSummary:n.failureSummary}))
                    }))
                  }
                });
                await context.close();
              }
            }
            fs.writeFileSync('site-audit/report.json',JSON.stringify(results,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.js

      - name: TLS and redirect verification
        shell: bash
        run: |
          {
            for host in jibbyjoo.jaytreebooks.com daily365.jaytreebooks.com ifitstopped.jaytreebooks.com; do
              echo "===== $host ====="
              echo "-- HTTP --"
              curl -I -sS --max-time 20 "http://$host/" | head -12
              echo "-- HTTPS --"
              curl -I -sS --max-time 20 "https://$host/" | head -12
              echo "-- TLS --"
              echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
              echo
            done
          } > site-audit/network.txt

      - uses: actions/upload-artifact@v4
        with:
          name: site-audit
          path: site-audit
          retention-days: 2
